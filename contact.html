
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jerfume Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="shop-header">
    <h1>🌸 Place recommend</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About the Owner</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="contact-card">

        <h2>Get in Touch</h2>
        <p class="subtitle">
            Have questions about our place recommend? Feel free to contact us.
        </p>

        <div class="contact-info">
            <h3>Contact Information</h3>
            <p><strong>Owner:</strong> Jerik Angeles</p>
            <p><strong>Email:</strong> jerikexample.com</p>
            <p><strong>Location:</strong> Manila, Philippines</p>
        </div>

        <form class="contact-form">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here..."></textarea>

            <button type="submit">Send Message</button>

        </form>

    </section>
</main>

<footer>
    <p>© 2026 Place recommend. All rights reserved.</p>
</footer>

</body>
</html>
